name: Auto-merge review hold

# A CHANGES_REQUESTED review is an opt-in to review before merge.
# Reviews fire `pull_request_review`, which auto-merge.yml (pull_request_target)
# does not receive, so this workflow disables an auto-merge the release App
# enabled when a reviewer requests changes. It never arms anything; the next
# auto-merge.yml run re-evaluates once the author pushes or relabels.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ SECURITY: under pull_request_review the workflow file and GITHUB_SHA     │
# │ come from the PR merge ref, i.e. PR content. This job therefore checks   │
# │ nothing out and runs nothing from the repository: it installs a pinned   │
# │ gh, mints the App token and disables auto-merge. Fork PRs and Dependabot │
# │ PRs get no repository secrets here; forks are never armed, and a         │
# │ Dependabot PR is held with the `hold` label instead.                     │
# └─────────────────────────────────────────────────────────────────────────┘
on:
  pull_request_review:
    types: [submitted]

permissions: {}

# Same group as auto-merge.yml, so the two never interleave: this run waits for
# an in-flight auto-merge run, and a later auto-merge run re-reads the reviews.
concurrency:
  group: auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  disarm:
    name: Disarm on changes requested
    if: >-
      github.event.review.state == 'changes_requested' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: {group: ent-default, labels: [self-hosted]}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Install gh (pinned, checksum-verified)
        env:
          GH_CLI_VERSION: "2.101.0"
          GH_CLI_SHA256: "9bca2d1c16825f109907a23307628a2f0698fbf99662b73a5cf0b020293072b8"
        run: |
          set -euo pipefail
          tgz="gh_${GH_CLI_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "/tmp/$tgz" "https://github.com/cli/cli/releases/download/v${GH_CLI_VERSION}/$tgz"
          echo "${GH_CLI_SHA256}  /tmp/$tgz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar -xzf "/tmp/$tgz" -C /tmp
          install -m 0755 "/tmp/gh_${GH_CLI_VERSION}_linux_amd64/bin/gh" "$HOME/.local/bin/gh"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Mint release App token
        id: app-token
        uses: unsigned-gg/actions/vendor/actions-create-github-app-token@fd981ada61381db6416ba67b2bbd2d779823d0b5 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}

      - name: Disable an App-enabled auto-merge
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        shell: bash
        run: |
          set -euo pipefail
          by=$(gh pr view "$PR" -R "$REPO" --json autoMergeRequest --jq '.autoMergeRequest.enabledBy.login // empty')
          # gh reports an App as app/<slug>; the API also uses <slug> and <slug>[bot].
          case "$by" in
            "$APP_SLUG"|"${APP_SLUG}[bot]"|"app/$APP_SLUG")
              gh pr merge "$PR" -R "$REPO" --disable-auto
              echo "::notice::changes requested: disabled the auto-merge the release App enabled" ;;
            *)
              echo "::notice::changes requested: no App-enabled auto-merge to disable (enabled by '${by:-nobody}')" ;;
          esac
